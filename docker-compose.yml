services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smelly_cat_recipe
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smelly_cat_recipe"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    command: sh -c "npm run backend:migrate && npm run backend:seed && npm run backend:dev"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/smelly_cat_recipe
      NODE_ENV: development
      PGSSL: "false"
      PORT: 3000
      TOKEN_SECRET: local-development-secret-change-before-deploy
      WECHAT_APP_ID: local-dev-app-id
      WECHAT_APP_SECRET: local-dev-app-secret
      WECHAT_CAT_OPENIDS: dev-cat-openid
      WECHAT_OWNER_OPENIDS: dev-owner-openid
    ports:
      - "3000:3000"

volumes:
  postgres-data:
